[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-engine"
version = "1.0.0"
description = "A clean, modular Retrieval-Augmented Generation (RAG) system built from scratch to demonstrate core RAG principles."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "python-dotenv>=1.0.1",
  "rank-bm25>=0.2.2",
  "numpy>=1.24.0",
  "streamlit>=1.36.0",
  "langchain>=0.2.12",
  "langchain-core>=0.2.20",
  "langchain-community>=0.2.11",
  "langchain-openai>=0.1.17",
  "chromadb>=0.5.5",
  "sentence-transformers>=3.0.1",
  "tiktoken>=0.7.0",
  "pypdf>=3.17.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.2.0"]

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["rag_engine*", "config*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"
