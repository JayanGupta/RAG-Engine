[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "biomed-rag-engine"
version = "1.0.0"
description = "Clinical Intelligence and Medical Literature RAG for oncology immunotherapy"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "python-dotenv>=1.0.1",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
  "httpx>=0.27.0",
  "lxml>=5.2.0",
  "rank-bm25>=0.2.2",
  "numpy>=1.26.0",
  "pandas>=2.2.0",
  "streamlit>=1.36.0",
  "langchain>=0.2.12",
  "langchain-core>=0.2.20",
  "langchain-community>=0.2.11",
  "langchain-openai>=0.1.17",
  "langchain-text-splitters>=0.2.2",
  "qdrant-client>=1.10.0",
  "chromadb>=0.5.5",
  "sentence-transformers>=3.0.1",
  "langchain-qdrant>=0.1.3",
  "langchain-chroma>=0.1.2",
  "tiktoken>=0.7.0",
]

[project.optional-dependencies]
eval = ["ragas>=0.1.10", "datasets>=2.20.0"]
rerank-cohere = ["cohere>=5.5.0"]
dev = ["pytest>=8.2.0"]

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["biomed_rag*", "config*"]

[tool.setuptools.package-dir]
"" = "."
biomed_rag = "src/biomed_rag"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"
